name: Daily Paper to Zenn

# 国内論文（J-STAGE）→ 要約 → WordPress + Zenn
#
# ワークフロー自体は Actions 画面から手動で無効化してある。
# 再開するときは Actions → このワークフロー → Enable workflow。

on:
  schedule:
    # 毎日 06:00 (Asia/Tokyo) = 21:00 UTC 前日
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      skip_wordpress:
        description: 'WordPress への投稿を飛ばす（Zenn だけ試す）'
        type: boolean
        default: false
      wp_draft:
        description: 'WordPress は下書きとして投稿する'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        working-directory: pipeline
        run: npm install

      - name: パイプラインを実行
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # WordPress.com のメール投稿（設定→執筆→メール投稿 の秘密のアドレス）
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          # 送信元。Gmail の場合はアプリパスワードが必要（通常のパスワードでは送れない）
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # リポジトリ自体が作業ディレクトリなので、記事の書き出し先を明示する
          ZENN_REPO_PATH: ${{ github.workspace }}
          SKIP_WORDPRESS: ${{ inputs.skip_wordpress }}
          WP_DRAFT: ${{ inputs.wp_draft }}
        run: npm run full

      - name: 生成物をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles posted.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Add article for $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
