name: Daily Paper to Zenn

on:
  schedule:
    # 毎日 06:00 (Asia/Tokyo) = 21:00 UTC 前日
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      post_to_bluesky:
        description: 'Bluesky に投稿する'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        working-directory: pipeline
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: パイプラインを実行
        working-directory: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLUESKY_EMAIL: ${{ secrets.BLUESKY_EMAIL }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          # スケジュール実行は常に投稿、手動実行のみ入力で抑制できる
          AUTO_POST_TO_BLUESKY: ${{ github.event_name != 'workflow_dispatch' || inputs.post_to_bluesky }}
          AUTO_POST_TO_ZENN: 'true'
          HATENA_ID: k518
          HATENA_BLOG_ID: k518.hatenablog.com
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          AUTO_POST_TO_HATENA: 'true'
          GITHUB_REPO: paper-to-zenn
          GITHUB_USERNAME: ${{ github.repository_owner }}
          ZENN_REPO_PATH: ${{ github.workspace }}
          OBSIDIAN_VAULT_PATH: ${{ github.workspace }}/obsidian
          SKIP_GIT_PUSH: 'true'
        run: node full-pipeline.js

      - name: 生成物をコミット
        run: |
          git config user.name "Paper-to-Note Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/ images/ obsidian/ posted.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Add article for $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
